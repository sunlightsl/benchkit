name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: verifier integrity (three-polarity self-check)
        run: node tests/selfcheck.mjs
      - name: end-to-end pipeline (mock agent)
        run: node tests/mock-agent-e2e.mjs
